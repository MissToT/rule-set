name: Update Rule Sets

on:
  schedule:
    - cron: '0 20 * * *'  # 每天北京时间凌晨 4:00（UTC 20:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Default Branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Checkout Previous Snapshot for Diff
        run: |
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code "$REPO_URL" refs/heads/mihomo > /dev/null 2>&1; then
            git clone --depth=1 --branch mihomo "$REPO_URL" prev_mihomo
            echo "[*] 已克隆 mihomo 历史快照，用于差异比对"
          else
            echo "[*] mihomo 分支尚不存在（首次运行），跳过差异比对"
          fi
          if git ls-remote --exit-code "$REPO_URL" refs/heads/bypass > /dev/null 2>&1; then
            git clone --depth=1 --branch bypass "$REPO_URL" prev_bypass
            echo "[*] 已克隆 bypass 历史快照，用于差异比对"
          else
            echo "[*] bypass 分支尚不存在，跳过差异比对"
          fi

      - name: Execute Compilation Script
        run: python scripts/convert.py

      - name: Push auto-generated rule templates to default branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 追踪新创建的文件夹
          git add rules/add/ rules/remove/
          
          # 检查是否有新文件产生，如果有则提交并推送回主分支
          if ! git diff --cached --quiet; then
            git commit -m "自动生成 rules/add 和 rules/remove 模板文件"
            git push
            echo "::notice::已自动在代码库中创建模板文件，请刷新网页查看"
          else
            echo "::notice::自定义规则模板文件已存在，无需更新默认分支"
          fi

      - name: Deploy to mihomo Branch
        run: |
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code "$REPO_URL" refs/heads/mihomo > /dev/null 2>&1; then
            git clone --depth=1 --branch mihomo "$REPO_URL" deploy_mihomo
          else
            (mkdir -p deploy_mihomo \
              && cd deploy_mihomo \
              && git init \
              && git remote add origin "$REPO_URL" \
              && git checkout --orphan mihomo)
          fi

          rsync -av --delete --exclude='.git' mihomo_out/ deploy_mihomo/

          cd deploy_mihomo
          
          TIME_STR=$(python3 -c "from datetime import datetime, timedelta, timezone; now=datetime.now(timezone(timedelta(hours=8))); print(f\"{now.year}年{now.month}月{now.day}日{now.strftime('%H:%M:%S')}\")")

          if [ -n "$(git status --porcelain)" ]; then
            while IFS= read -r file; do
              if [ -n "$file" ]; then
                git add "$file"
                filename=$(basename "$file")
                MSG=$(python3 -c "import json; d=json.load(open('../commit_msgs.json')); print(d.get('$file', ''))")
                
                if [ -z "$MSG" ]; then
                  MSG="${TIME_STR} - 更新 ${filename}"
                fi
                
                git commit -m "$MSG"
              fi
            done < <(git status --porcelain | cut -c4-)
            
            git push origin HEAD:mihomo
            echo "::notice::mihomo 分支已更新"
          else
            echo "::notice::mihomo 分支无变更"
          fi

      - name: Deploy to singbox Branch
        run: |
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code "$REPO_URL" refs/heads/singbox > /dev/null 2>&1; then
            git clone --depth=1 --branch singbox "$REPO_URL" deploy_singbox
          else
            (mkdir -p deploy_singbox \
              && cd deploy_singbox \
              && git init \
              && git remote add origin "$REPO_URL" \
              && git checkout --orphan singbox)
          fi

          rsync -av --delete --exclude='.git' singbox_out/ deploy_singbox/

          cd deploy_singbox
          
          TIME_STR=$(python3 -c "from datetime import datetime, timedelta, timezone; now=datetime.now(timezone(timedelta(hours=8))) ; print(f\"{now.year}年{now.month}月{now.day}日{now.strftime('%H:%M:%S')}\")")

          if [ -n "$(git status --porcelain)" ]; then
            while IFS= read -r file; do
              if [ -n "$file" ]; then
                git add "$file"
                filename=$(basename "$file")
                MSG=$(python3 -c "import json; d=json.load(open('../commit_msgs.json')); print(d.get('$file', ''))")
                
                if [ -z "$MSG" ]; then
                  MSG="${TIME_STR} - 更新 ${filename}"
                fi
                
                git commit -m "$MSG"
              fi
            done < <(git status --porcelain | cut -c4-)
            
            git push origin HEAD:singbox
            echo "::notice::singbox 分支已更新"
          else
            echo "::notice::singbox 分支无变更"
          fi

      - name: Deploy to bypass Branch
        run: |
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code "$REPO_URL" refs/heads/bypass > /dev/null 2>&1; then
            git clone --depth=1 --branch bypass "$REPO_URL" deploy_bypass
          else
            (mkdir -p deploy_bypass \
              && cd deploy_bypass \
              && git init \
              && git remote add origin "$REPO_URL" \
              && git checkout --orphan bypass)
          fi

          rsync -av --delete --exclude='.git' bypass_out/ deploy_bypass/

          cd deploy_bypass
          
          TIME_STR=$(python3 -c "from datetime import datetime, timedelta, timezone; now=datetime.now(timezone(timedelta(hours=8))); print(f\"{now.year}年{now.month}月{now.day}日{now.strftime('%H:%M:%S')}\")")

          if [ -n "$(git status --porcelain)" ]; then
            while IFS= read -r file; do
              if [ -n "$file" ]; then
                git add "$file"
                filename=$(basename "$file")
                MSG=$(python3 -c "import json; d=json.load(open('../commit_msgs.json')); print(d.get('$file', ''))")
                
                if [ -z "$MSG" ]; then
                  MSG="${TIME_STR} - 更新 ${filename}"
                fi
                
                git commit -m "$MSG"
              fi
            done < <(git status --porcelain | cut -c4-)
            
            git push origin HEAD:bypass
            echo "::notice::bypass 分支已更新"
          else
            echo "::notice::bypass 分支无变更"
          fi